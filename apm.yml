name: spec-development-protocol
version: 0.5.3
description: An AI-agentic framework for spec-driven engineering — structured, 
  traceable, and ready for both greenfield and legacy web projects.
author: Michal Wojcik
license: MIT
# Which agent platforms to deploy to.
# Resolution order: --target flag > this field > auto-detect from filesystem.
# Accepted values: copilot, claude, cursor, opencode, codex, gemini, windsurf, all
targets:
  - copilot
  - claude
  - cursor
  - codex
  - gemini
dependencies:
  apm: []
  mcp: []
includes:
  - .apm/agents/
  - .apm/instructions/
  - .apm/prompts/
  - .apm/skills/
scripts:
  start: apm compile
  sync-templates: bash scripts/sync-templates.sh
  check-templates: bash scripts/sync-templates.sh --check
marketplace:
  owner:
    name: WojcikMM
    url: https://github.com/WojcikMM

  # Default tag pattern used to resolve version ranges for each package.
  build:
    tagPattern: "v{version}"

  # Output targets (map form). 'claude' is enabled by default;
  # uncomment 'codex' below to publish the Codex artifact too.
  # Each output writes to its profile default path; add 'path:'
  # under a key to override.
  outputs:
    claude: {}
    codex: {}
    # copilot: {}
    #
    # Note: enabling codex requires every package below to declare
    # 'category:' (e.g. category: Productivity).

  # CI tip: build one or all formats with a machine-readable manifest:
  #   apm pack --marketplace=claude,codex --json | jq -r '.marketplace.outputs[].path'

  packages:
    # - name: spec-development-protocol
    #   description: An AI-agentic framework for spec-driven engineering — structured, traceable, and ready for both greenfield and legacy web projects.
    #   source: WojcikMM/spec-development-protocol
    #   version: "v0.3.0"
    #   category: Productivity
      # Optional overrides:
      # subdir: path/inside/repo
      # Per-package version tag (recommended for monorepos so each
      # package can be released independently). Leave commented for
      # repo-wide lockstep tagging.
      # tag_pattern: "{name}-v{version}"
      # include_prerelease: false
      # ref: main  # pin to an explicit ref instead of a version range
    # - name: example-package
    #   description: Human-readable description of the package
    #   source: acme-org/example-package
    #   version: "^1.0.0"
      # Required when outputs includes codex:
      # category: Productivity
      # Optional overrides:
      # subdir: path/inside/repo
      # Per-package version tag (recommended for monorepos so each
      # package can be released independently). Leave commented for
      # repo-wide lockstep tagging.
      # tag_pattern: "{name}-v{version}"
      # include_prerelease: false
      # ref: main  # pin to an explicit ref instead of a version range
    # Publish this repository package so consumers can install it globally.
    - name: spec-development-protocol
      source: ./
      description: An AI-agentic framework for spec-driven engineering — structured, traceable, and ready for both greenfield and legacy web projects.
      version: "^0.5.2"
      tag_pattern: "{name}-v{version}"
      category: Productivity
